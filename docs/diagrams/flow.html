<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;width:2000px;height:470px;background:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;padding:44px 48px}
h1{margin:0 0 34px;font-size:50px;color:#141a2b;letter-spacing:-.5px}
.row{display:flex;align-items:center}
.card{width:272px;height:278px;border-radius:26px;padding:28px 26px;color:#fff;box-shadow:0 10px 24px rgba(20,26,43,.12)}
.ic{width:78px;height:78px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.ic svg{width:46px;height:46px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k{font-size:23px;font-weight:800;letter-spacing:.09em;opacity:.92;margin-bottom:6px}
.t{font-size:33px;font-weight:800;line-height:1.22}
.chev{width:55px;display:flex;justify-content:center}
.chev svg{width:22px;height:34px;fill:none;stroke:#8a93a6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.red{background:#e5484d}.blue{background:#1185e1}.purple{background:#7b5ce6}.green{background:#1aa058}.amber{background:#e39b14}.dark{background:#344156}
</style></head><body>
<h1>Wholesale reporting · Snowflake + Strategy</h1>
<div class="row">
<div class="card red"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 16c1.5-1.4 4.5-1.4 6 0"/></svg></div><div class="k">PROBLEM</div><div class="t">Exec totals don't match</div></div>
<div class="chev"><svg viewBox="0 0 12 20"><path d="M2 2l8 8-8 8"/></svg></div>
<div class="card blue"><div class="ic"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></div><div class="k">DATA</div><div class="t">Snowflake, one grain</div></div>
<div class="chev"><svg viewBox="0 0 12 20"><path d="M2 2l8 8-8 8"/></svg></div>
<div class="card purple"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></div><div class="k">SEMANTIC</div><div class="t">Strategy metrics, live</div></div>
<div class="chev"><svg viewBox="0 0 12 20"><path d="M2 2l8 8-8 8"/></svg></div>
<div class="card green"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7H4V5h11"/></svg></div><div class="k">RECONCILE</div><div class="t">15 tests, to the cent</div></div>
<div class="chev"><svg viewBox="0 0 12 20"><path d="M2 2l8 8-8 8"/></svg></div>
<div class="card amber"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg></div><div class="k">TROUBLESHOOT</div><div class="t">Find $16,656 in 5 steps</div></div>
<div class="chev"><svg viewBox="0 0 12 20"><path d="M2 2l8 8-8 8"/></svg></div>
<div class="card dark"><div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><div class="k">SECURE</div><div class="t">Read-only, views only</div></div>
</div></body></html>
